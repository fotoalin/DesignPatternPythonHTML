<header class="bg-gray-800 text-white p-4">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-2xl font-bold">
            <a href="{{ SITEURL }}/">{{ SITENAME }}</a>
        </h1>
        <nav>
            <ul class="flex space-x-4">
                {% for title, link in MENUITEMS %}
                    <li><a href="{{ link }}" class="hover:text-gray-300">{{ title }}</a></li>
                {% endfor %}
                {% if DISPLAY_PAGES_ON_MENU %}
                    {% for p in pages %}
                        <li{% if p == page %} class="active"{% endif %}><a href="{{ SITEURL }}/{{ p.url }}" class="hover:text-gray-300">{{ p.title }}</a></li>
                    {% endfor %}
                {% endif %}
                {% if DISPLAY_CATEGORIES_ON_MENU %}
                    {% for cat, null in categories %}
                        <li{% if cat == category %} class="active"{% endif %}><a href="{{ SITEURL }}/{{ cat.url }}" class="hover:text-gray-300">{{ cat.name }}</a></li>
                    {% endfor %}
                {% endif %}
            </ul>
        </nav>
    </div>
</header>
