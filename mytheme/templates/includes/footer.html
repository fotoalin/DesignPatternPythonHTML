<footer class="bg-gray-200 text-gray-700 p-4 mt-8">
    <div class="container mx-auto text-center">
        <p>&copy; {{ SITENAME }} <span id="current-year"></span>. Powered by <a href="https://getpelican.com/" class="underline hover:text-gray-900">Pelican</a>.</p>
        {% if SOCIAL %}
        <div class="mt-2">
            {% for name, url in SOCIAL %}
                <a href="{{ url }}" target="_blank" rel="noopener noreferrer" class="inline-block mx-2 hover:text-gray-900">{{ name }}</a>
            {% endfor %}
        </div>
        {% endif %}
    </div>
    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</footer>
