{% extends "base.html" %}

{% block title %}{{ page.title|striptags }} - {{ SITENAME }}{% endblock %}

{% block content %}
    <article class="prose lg:prose-xl max-w-none">
        <header class="mb-8">
            <h1 class="text-4xl font-bold">{{ page.title }}</h1>
        </header>
        
        <div class="entry-content">
            {{ page.content }}
        </div>
    </article>
{% endblock %}
